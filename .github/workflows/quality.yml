name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm health
      - name: Capture formatter diff
        if: always()
        run: |
          pnpm exec prettier --write README.md src/app/api/organizations/select/route.ts src/app/login/page.tsx src/app/page.tsx src/components/dashboard/dashboard-shell.module.css src/components/dashboard/dashboard-shell.tsx src/components/dashboard/live-backups.tsx src/components/dashboard/live-databases.tsx src/components/dashboard/live-shared.tsx src/components/dashboard/organization-switcher.module.css src/components/ui/connection-modal.tsx src/lib/perminister-auth.ts tests/e2e/app.spec.mjs
          git -c color.ui=false --no-pager diff -- README.md src/app/api/organizations/select/route.ts src/app/login/page.tsx src/app/page.tsx src/components/dashboard/dashboard-shell.module.css src/components/dashboard/dashboard-shell.tsx src/components/dashboard/live-backups.tsx src/components/dashboard/live-databases.tsx src/components/dashboard/live-shared.tsx src/components/dashboard/organization-switcher.module.css src/components/ui/connection-modal.tsx src/lib/perminister-auth.ts tests/e2e/app.spec.mjs
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm health:styles
      - run: pnpm format:check
      - run: pnpm build
