[databases]
* = host=127.0.0.1 port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6433
unix_socket_dir = /run/nanogres-pgbouncer-migrations
pidfile = /run/nanogres-pgbouncer-migrations/pgbouncer.pid
logfile =
syslog = 0

auth_type = scram-sha-256
auth_file = /etc/nanogres/pgbouncer-users.txt
auth_user = nanogres_pgbouncer_auth
auth_dbname = postgres
auth_query = SELECT username, password FROM nanogres_pgbouncer.get_auth($1)

client_tls_sslmode = require
client_tls_cert_file = /etc/nanogres/pgbouncer/server.crt
client_tls_key_file = /etc/nanogres/pgbouncer/server.key
server_tls_sslmode = disable

pool_mode = session
max_client_conn = 100
default_pool_size = 4
reserve_pool_size = 2
reserve_pool_timeout = 3
max_db_connections = 20
server_idle_timeout = 600
query_wait_timeout = 120
